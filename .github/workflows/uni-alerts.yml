name: University alerts

# Every hour from 07:00 to 23:00 Israel time (one hour earlier in winter).
# Pushes a phone alert from Shaked Hub for new Moodle deadlines, reminders
# two days and on the day before a deadline, and uni mails that need action.
on:
  schedule:
    - cron: "0 4-20 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call Shaked Hub
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://ai-product-academy.onrender.com/tasks/check-uni
