name: Mark inbox read

# On demand: marks every unread inbox mail as read through Shaked Hub.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Shaked Hub
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 170 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://ai-product-academy.onrender.com/tasks/gmail-mark-read
          echo
