name: Mark mail read

# On demand: marks every unread mail matching a Gmail search as read through Shaked Hub.
on:
  workflow_dispatch:
    inputs:
      query:
        description: Gmail search to mark as read
        default: "is:unread in:inbox"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Shaked Hub
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          QUERY: ${{ inputs.query }}
        run: |
          body=$(jq -cn --arg q "$QUERY" '{query: $q}')
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 170 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$body" https://ai-product-academy.onrender.com/tasks/gmail-mark-read
          echo
