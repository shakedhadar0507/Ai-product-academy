name: Keep Shaked Hub awake

# Render's free tier sleeps after 15 minutes without traffic, and waking takes
# about a minute. A ping every 10 minutes keeps it awake; one always-on service
# fits inside the free 750 hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the login page
        run: curl -fsS -o /dev/null --retry 2 --retry-delay 20 --max-time 90 https://ai-product-academy.onrender.com/login
