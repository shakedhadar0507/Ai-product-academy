name: Keep Shaked Hub awake and check university alerts

# Backup only: the server now keeps itself awake and runs the checks every 10 minutes by
# itself (GitHub's schedule fires only every few hours). Each run also prints the server's
# health report (Google, push, Garmin, last uni check) so problems show up in the log.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check university alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 2 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://ai-product-academy.onrender.com/tasks/check-uni
      - name: Health report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo
          curl -sS --max-time 90 -H "X-Cron-Secret: $CRON_SECRET" \
            https://ai-product-academy.onrender.com/tasks/status
