<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Offline · Shaked Hub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; color: #334155; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.08);
            padding: 32px; max-width: 320px; margin: 16px; text-align: center; }
    button { margin-top: 16px; background: #6366f1; color: #fff; border: 0; border-radius: 8px;
             padding: 10px 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <p style="font-size:40px;margin:0">📡</p>
    <h1 style="font-size:18px">You're offline</h1>
    <p style="font-size:14px;color:#64748b">The dashboard needs a connection to load fresh data.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
